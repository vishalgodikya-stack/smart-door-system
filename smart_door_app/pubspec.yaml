name: smart_door_app
description: Smart Door Security System — Mobile Companion App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & WebSocket
  http: ^1.2.1
  web_socket_channel: ^2.4.0
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod: ^2.5.1

  # Secure Storage (JWT)
  flutter_secure_storage: ^9.2.2

  # Local Notifications
  flutter_local_notifications: ^17.2.3

  # Foreground Service (Android — keeps WS alive when app backgrounded)
  flutter_foreground_task: ^8.6.0

  # Image handling
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # OTP PIN input widget
  pinput: ^3.0.0

  # QR Code display (for TOTP setup)
  qr_flutter: ^4.1.0

  # Date/time formatting
  intl: ^0.19.0

  # Navigation
  go_router: ^14.2.0

  # Icons
  cupertino_icons: ^1.0.8

  # Google Fonts (Inter — no local font files needed)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/
